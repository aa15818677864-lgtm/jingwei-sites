<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>运营概览 | 刘毅律师团队</title>
  <link rel="stylesheet" href="style.css?v=20260723-simple-v1">
  <script src="/site-config.js" defer></script>
  <script src="script.js?v=20260723-simple-v1" defer></script>
</head>
<body>
  <main class="dashboard-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">刘毅律师团队 · Liu Yi Lawyer Team</p>
        <h1>运营概览</h1>
        <p id="freshness" class="header-note">正在读取网站数据</p>
      </div>
      <div class="top-actions">
        <a class="text-link" href="/articles/">查看文章</a>
        <div class="segmented-control" aria-label="统计范围">
          <button class="is-active" type="button" data-range="day" aria-pressed="true">日</button>
          <button type="button" data-range="month" aria-pressed="false">月</button>
        </div>
      </div>
    </header>

    <section class="metric-grid" aria-label="关键指标">
      <article class="metric-card">
        <span id="consultationLabel">今日咨询</span>
        <strong id="consultationCount">--</strong>
        <small id="consultationHint">正在核对来源</small>
      </article>
      <article class="metric-card">
        <span>已发布文章</span>
        <strong id="publishedCount">--</strong>
        <small id="publishedHint">按三种语言去重</small>
      </article>
      <article class="metric-card">
        <span>已确认收录</span>
        <strong id="indexedCount">--</strong>
        <small id="indexedHint">等待 Search Console</small>
      </article>
      <article class="metric-card">
        <span>待发布</span>
        <strong id="pendingCount">--</strong>
        <small id="pendingHint">当前写作队列</small>
      </article>
    </section>

    <div class="status-line" aria-live="polite">
      <span id="sourceSummary">正在核对数据来源</span>
      <span id="lastUpdated">--</span>
    </div>

    <section class="work-grid">
      <section class="panel" aria-labelledby="activity-title">
        <div class="panel-head">
          <div>
            <h2 id="activity-title">最近变化</h2>
            <p id="trendHint">正在读取文章与咨询记录</p>
          </div>
          <div class="chart-legend" aria-label="图表图例">
            <span><i class="article-key"></i>文章</span>
            <span><i class="consultation-key"></i>咨询</span>
          </div>
        </div>
        <div id="activityChart" class="activity-chart" aria-label="文章发布与咨询趋势"></div>
      </section>

      <section class="panel" aria-labelledby="queue-title">
        <div class="panel-head">
          <div>
            <h2 id="queue-title">下一步</h2>
            <p id="queueSummary">正在读取写作队列</p>
          </div>
        </div>
        <div id="queueRows" class="queue-list" aria-live="polite"></div>
        <p id="candidateNote" class="panel-note"></p>
      </section>
    </section>

    <section class="panel article-panel" aria-labelledby="article-title">
      <div class="panel-head article-head">
        <div>
          <h2 id="article-title">文章状态</h2>
          <p id="articleSummary">正在读取文章明细</p>
        </div>
        <div class="filter-control" aria-label="文章状态筛选">
          <button class="is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-filter="indexed" aria-pressed="false">已收录</button>
          <button type="button" data-filter="unknown" aria-pressed="false">待确认</button>
          <button type="button" data-filter="issues" aria-pressed="false">有问题</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>文章</th><th>专题</th><th>最后更新</th><th>技术状态</th><th>收录</th></tr>
          </thead>
          <tbody id="articleRows"><tr><td colspan="5">读取中</td></tr></tbody>
        </table>
      </div>
    </section>

    <details class="details-panel">
      <summary>详细数据</summary>
      <div class="details-grid">
        <section>
          <h2>搜索表现</h2>
          <dl>
            <div><dt>点击</dt><dd id="gscClicks">--</dd></div>
            <div><dt>展示</dt><dd id="gscImpressions">--</dd></div>
            <div><dt>点击率</dt><dd id="gscCtr">--</dd></div>
            <div><dt>平均排名</dt><dd id="gscPosition">--</dd></div>
          </dl>
        </section>
        <section>
          <h2>选题储备</h2>
          <p id="topicDetail">--</p>
        </section>
        <section>
          <h2>AI 搜索基础</h2>
          <p id="geoDetail">--</p>
        </section>
        <section>
          <h2>数据来源</h2>
          <p id="sourceDetail">--</p>
        </section>
      </div>
    </details>
  </main>
</body>
</html>
