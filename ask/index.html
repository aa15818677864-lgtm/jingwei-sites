<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI法律初步问答 | 刘毅律师团队</title>
  <meta name="description" content="刘毅律师团队 AI 法律初步问答。先在线说明情况，再查看对应咨询专题与服务入口。">
  <link rel="canonical" href="https://www.jingwei-law.com/ask/">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="brand-pane" aria-label="刘毅律师团队">
      <a class="brand" href="/">
        <span class="brand-mark">刘</span>
        <span>
          <strong>刘毅律师团队</strong>
          <em>跨境中国法律事务</em>
        </span>
      </a>
      <div class="brand-copy">
        <p class="eyebrow">AI法律初步问答</p>
        <h1>先把情况说清楚，AI 帮你初步判断</h1>
        <p>不需要一次讲完整，先说你在哪里、对方或财产在哪里、发生了什么。</p>
      </div>
      <img class="office-image" src="/img/banner1.webp" alt="法律事务沟通场景" loading="eager" fetchpriority="high" decoding="async">
      <div class="side-note">温馨提示：在线回复仅供参考，正式方案以律师审核意见为准。</div>
    </section>

    <section class="chat-phone" aria-label="AI法律对话窗口">
      <header class="chat-header">
        <a class="back-link" href="/articles/" aria-label="返回文章库">‹</a>
        <div class="chat-person">
          <span class="avatar">律</span>
          <span>
            <strong>AI法律助理</strong>
            <em><i></i>在线初步问答</em>
          </span>
        </div>
        <a class="home-link" href="/articles/" aria-label="查看专题入口">专题</a>
      </header>

      <div class="chat-main">
        <section class="chat-stream" aria-label="对话区">
          <div class="chat-body" id="chatBody" aria-live="polite"></div>
          <div class="quick-replies" id="quickReplies" aria-label="快捷回复"></div>
          <form class="composer" id="chatForm">
            <textarea id="chatInput" rows="1" placeholder="输入你的情况" enterkeyhint="send"></textarea>
            <button type="submit">发送</button>
          </form>
        </section>

        <aside class="chat-ad" id="routeAd" aria-label="相关专题入口" hidden>
          <p class="ad-badge">相关专题</p>
          <h2 class="ad-title" id="adTitle">跨境中国内地法律事务</h2>
          <p class="ad-copy" id="adCopy">如需进一步咨询或委托，可查看对应专题页了解服务内容与办理方式。</p>
          <a class="ad-link" id="adLink" href="/us/index_cn.html?source=ask-chat" target="_blank" rel="noopener">打开专题页</a>
          <p class="ad-note">可按你的情况选择最合适的专题入口。</p>
        </aside>
      </div>
    </section>
  </main>

  <script src="/site-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
