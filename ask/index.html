<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI法律初步问答 | 刘毅律师团队</title>
  <meta name="description" content="刘毅律师团队 AI 法律初步问答，通过对话方式整理跨境中国内地法律事务信息，并推荐合适的咨询入口。">
  <link rel="canonical" href="https://www.jingwei-law.com/ask/">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="brand-pane" aria-label="刘毅律师团队">
      <a class="brand" href="/">
        <span class="brand-mark">刘</span>
        <span>
          <strong>刘毅律师团队</strong>
          <em>跨境中国法律事务</em>
        </span>
      </a>
      <div class="brand-copy">
        <p class="eyebrow">AI法律初步问答</p>
        <h1>像聊天一样，先把问题说清楚</h1>
        <p>系统会根据你的所在地、事务类型和是否涉及中国内地，推荐对应的咨询表单入口。</p>
      </div>
      <div class="topic-jump" aria-label="专题入口导航">
        <strong>现有专题入口</strong>
        <p>老投放页保持原样，这里只放导航入口。</p>
        <a href="/articles/#topic-nav">查看全部专题入口</a>
      </div>
      <img class="office-image" src="/img/banner1.webp" alt="法律事务沟通场景" loading="lazy" decoding="async">
      <div class="side-note">仅作初步信息整理，不构成正式法律意见。</div>
    </section>

    <section class="chat-phone" aria-label="AI法律对话窗口">
      <header class="chat-header">
        <a class="back-link" href="/articles/" aria-label="返回文章库">‹</a>
        <div class="chat-person">
          <span class="avatar">律</span>
          <span>
            <strong>AI法律助理</strong>
            <em>刘毅律师团队</em>
          </span>
        </div>
        <a class="home-link" href="/articles/#topic-nav" aria-label="查看专题入口">专题</a>
      </header>

      <div class="chat-body" id="chatBody" aria-live="polite"></div>

      <div class="quick-replies" id="quickReplies" aria-label="快捷回复"></div>

      <form class="composer" id="chatForm">
        <textarea id="chatInput" rows="1" placeholder="输入你的情况"></textarea>
        <button type="submit">发送</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
