name: Live URL Protection Check

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "15 19 * * *"

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify protected and SEO URLs
        run: node tools/verify-live.mjs
