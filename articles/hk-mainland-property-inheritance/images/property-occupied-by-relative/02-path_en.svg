  <g class="t" text-anchor="middle"><circle cx="160" cy="354" r="66" fill="#f7e8eb" stroke="#a30d23" stroke-width="7"/><path d="m130 356 30-28 30 28v35h-60z" fill="none" stroke="#a30d23" stroke-width="6"/><text class="label" x="160" y="464">Property</text><text class="small" x="160" y="495">Title and co-ownership</text>
