<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Preserve evidence before changing locks, utilities or possessions">
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;fill:#142033}.ey{font-size:23px;font-weight:700;fill:#315f8f}.h{font-size:46px;font-weight:760}.label{font-size:27px;font-weight:760}.item{font-size:24px}.card{fill:#fff;stroke:#d8e0ea;stroke-width:2}</style>
  <rect width="1200" height="720" fill="#f4f7f8"/><text class="t ey" x="76" y="78">Relative in the home · When there is a dispute</text><text class="t h" x="76" y="142">Preserve the facts first</text>
  <rect class="card" x="76" y="214" width="494" height="382" rx="8"/><circle cx="132" cy="272" r="28" fill="#a30d23"/><path d="m119 259 26 26m0-26-26 26" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text class="t label" x="180" y="282">Do not start with</text>
  <g class="t item"><text x="132" y="362">Changing locks</text><text x="132" y="432">Cutting utilities</text><text x="132" y="502">Removing possessions</text></g><g stroke="#e7b7c0" stroke-width="3"><path d="M130 382h350M130 452h350"/></g>
  <rect class="card" x="630" y="214" width="494" height="382" rx="8"/><circle cx="686" cy="272" r="28" fill="#08756f"/><path d="m672 273 10 11 19-25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="t label" x="734" y="282">Preserve first</text>
  <g class="t item"><text x="686" y="362">Current property photos</text><text x="686" y="432">Management and payment records</text><text x="686" y="502">Occupation and message timeline</text></g><g stroke="#b8d9d5" stroke-width="3"><path d="M684 382h350M684 452h350"/></g>
  <rect x="286" y="628" width="628" height="52" rx="8" fill="#e7eef7"/><text class="t" x="600" y="662" text-anchor="middle" style="font-size:21px;font-weight:700">Preserve the facts before deciding on negotiation, moving out or a dispute route</text>
</svg>
