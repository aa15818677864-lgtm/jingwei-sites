<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="遺產房有居住爭議時先保存資料，不要自行換鎖斷水電或搬物品">
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;fill:#142033}.ey{font-size:23px;font-weight:700;fill:#315f8f}.h{font-size:46px;font-weight:760}.label{font-size:27px;font-weight:760}.item{font-size:24px}.card{fill:#fff;stroke:#d8e0ea;stroke-width:2}</style>
  <rect width="1200" height="720" fill="#f4f7f8"/><text class="t ey" x="76" y="78">親屬居住 · 有爭議時</text><text class="t h" x="76" y="142">先做可還原的事</text>
  <rect class="card" x="76" y="214" width="494" height="382" rx="8"/><circle cx="132" cy="272" r="28" fill="#a30d23"/><path d="m119 259 26 26m0-26-26 26" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text class="t label" x="180" y="282">先不要做</text>
  <g class="t item"><text x="132" y="362">換鎖</text><text x="132" y="432">斷水電</text><text x="132" y="502">搬走屋內物品</text></g><g stroke="#e7b7c0" stroke-width="3"><path d="M130 382h350M130 452h350"/></g>
  <rect class="card" x="630" y="214" width="494" height="382" rx="8"/><circle cx="686" cy="272" r="28" fill="#08756f"/><path d="m672 273 10 11 19-25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="t label" x="734" y="282">應先保存</text>
  <g class="t item"><text x="686" y="362">房屋現況照片</text><text x="686" y="432">物業與付款記錄</text><text x="686" y="502">入住與溝通時間線</text></g><g stroke="#b8d9d5" stroke-width="3"><path d="M684 382h350M684 452h350"/></g>
  <rect x="286" y="628" width="628" height="52" rx="8" fill="#e7eef7"/><text class="t" x="600" y="662" text-anchor="middle" style="font-size:21px;font-weight:700">先保存事實，再決定協商、搬離或爭議路徑</text>
</svg>
