  <g transform="translate(344 224)"><rect class="card" width="244" height="300" rx="8"/><rect x="64" y="68" width="116" height="148" rx="8" fill="#e5f2f0" stroke="#08756f" stroke-width="6"/><path d="M88 112h68M88 146h68M88 180h42" stroke="#08756f" stroke-width="7" stroke-linecap="round"/><text class="t label" x="122" y="258" text-anchor="middle">Lease in place</text><text class="t small" x="122" y="286" text-anchor="middle">Check term and payments</text></g>
  <g transform="translate(614 224)"><rect class="card" width="244" height="300" rx="8"/><circle cx="92" cy="108" r="30" fill="#e7eef7"/><circle cx="152" cy="108" r="30" fill="#e7eef7"/><path d="M54 196c7-46 22-65 38-65s31 19 38 65M114 196c7-46 22-65 38-65s31 19 38 65" fill="none" stroke="#315f8f" stroke-width="8" stroke-linecap="round"/><text class="t label" x="122" y="258" text-anchor="middle">Permitted resident</text><text class="t small" x="122" y="286" text-anchor="middle">Check the prior arrangement</text></g>
  <g transform="translate(884 224)"><rect class="card" width="244" height="300" rx="8"/><circle cx="122" cy="140" r="70" fill="#f4ead5"/><text x="122" y="166" text-anchor="middle" style="font:760 78px -apple-system,BlinkMacSystemFont,sans-serif;fill:#9a6715">?</text><text class="t label" x="122" y="258" text-anchor="middle">Unclear basis</text><text class="t small" x="122" y="286" text-anchor="middle">Build the timeline</text></g>
  <rect x="236" y="584" width="728" height="66" rx="8" fill="#142033"/><text x="600" y="627" text-anchor="middle" style="font:700 25px -apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;fill:#fff">Do not decide the issue from years of occupation alone</text>
