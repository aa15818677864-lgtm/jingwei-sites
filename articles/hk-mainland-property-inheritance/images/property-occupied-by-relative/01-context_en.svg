<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="A relative may occupy an estate property under four different arrangements">
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;fill:#142033}.ey{font-size:23px;font-weight:700;fill:#a30d23}.h{font-size:46px;font-weight:760}.label{font-size:25px;font-weight:760}.small{font-size:20px;fill:#607083}.card{fill:#fff;stroke:#d8e0ea;stroke-width:2}</style>
  <rect width="1200" height="720" fill="#f4f7f8"/><text class="t ey" x="76" y="78">Relative in the home · Identify the arrangement</text><text class="t h" x="76" y="142">One home, four possible arrangements</text>
