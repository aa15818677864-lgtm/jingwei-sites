<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="香港家屬想放棄內地遺產，作決定前先算清三筆賬"><style>
      .bg{fill:#f3f6f8}.panel{fill:#fff;stroke:#d7dfe8;stroke-width:2}.ink{fill:#142033}.muted{fill:#52647a}.red{fill:#a30d23}.gold{fill:#d39b31}.teal{fill:#16736b}.blue{fill:#315f86}
      .kicker{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:0}.title{font:760 39px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:0}.label{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:0}.small{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:0}.num{font:760 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
    </style><rect class="bg" width="1200" height="720"/><rect class="panel" x="36" y="36" width="1128" height="648" rx="8"/><rect class="red" x="72" y="72" width="112" height="7"/><text x="72" y="116" text-anchor="start" class="kicker red">情況</text><text x="72" y="168" text-anchor="start" class="title ink">香港家屬想放棄內地遺產，作決定前先算清三筆賬</text><rect class="panel" x="72" y="306" width="318" height="290" rx="8"/><circle class="red" cx="116" cy="354" r="16"/><text x="102" y="416" text-anchor="start" class="label ink">第一筆：不是只看一</text><text x="102" y="450" text-anchor="start" class="label ink">套房</text><rect class="red" opacity=".12" x="102" y="502" width="258" height="54" rx="6"/><rect class="panel" x="426" y="306" width="318" height="290" rx="8"/><circle class="teal" cx="470" cy="354" r="16"/><text x="456" y="416" text-anchor="start" class="label ink">第二筆：債務和已墊</text><text x="456" y="450" text-anchor="start" class="label ink">付費用</text><rect class="teal" opacity=".12" x="456" y="502" width="258" height="54" rx="6"/><rect class="panel" x="780" y="306" width="318" height="290" rx="8"/><circle class="blue" cx="824" cy="354" r="16"/><text x="810" y="416" text-anchor="start" class="label ink">第三筆：放棄後由誰</text><text x="810" y="450" text-anchor="start" class="label ink">辦、怎樣分</text><rect class="blue" opacity=".12" x="810" y="502" width="258" height="54" rx="6"/></svg>
