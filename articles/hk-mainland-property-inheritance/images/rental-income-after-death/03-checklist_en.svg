<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="An auditable rent ledger contains five fields">
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;fill:#142033}.ey{font-size:23px;font-weight:700;fill:#315f8f}.h{font-size:46px;font-weight:760}.head{font-size:20px;font-weight:760;fill:#fff}.cell{font-size:21px}.muted{font-size:19px;fill:#667589}.grid{stroke:#d8e0ea;stroke-width:2}</style>
  <rect width="1200" height="720" fill="#f4f7f8"/><text class="t ey" x="76" y="78">Estate property rent · Auditable record</text><text class="t h" x="76" y="142">Five fields in a rent ledger</text>
  <rect x="76" y="218" width="1048" height="360" rx="8" fill="#fff" stroke="#d8e0ea" stroke-width="2"/><path d="M76 218h1048v82H76z" fill="#142033"/>
  <path class="grid" d="M266 218v360M468 218v360M690 218v360M902 218v360M76 392h1048M76 484h1048"/>
  <g class="t head" text-anchor="middle"><text x="171" y="268">Month</text><text x="367" y="268">Received</text><text x="579" y="268">Deposit / Arrears</text><text x="796" y="268">Expenses</text><text x="1013" y="268">Notice</text></g>
  <g class="t cell" text-anchor="middle"><text x="171" y="355">July</text><text x="367" y="355">12,000</text><text x="579" y="355">Includes arrears</text><text x="796" y="355">Management fee</text><text x="1013" y="355">Confirmed in writing</text><text x="171" y="447">August</text><text x="367" y="447">10,000</text><text x="579" y="447">Deposit separate</text><text x="796" y="447">Repair to check</text><text x="1013" y="447">Account unchanged</text><text x="171" y="539">September</text><text x="367" y="539">—</text><text x="579" y="539">Tenant leaving</text><text x="796" y="539">—</text><text x="1013" y="539">One notice needed</text></g>
  <rect x="312" y="612" width="576" height="54" rx="8" fill="#e7eef7"/><text class="t muted" x="600" y="647" text-anchor="middle">Every payment, expense and notice can be checked</text>
</svg>
