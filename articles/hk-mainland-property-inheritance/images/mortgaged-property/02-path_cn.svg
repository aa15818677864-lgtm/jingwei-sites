<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="遗产房仍有按揭或欠款，继承和还款应怎样排顺序"><style>
      .bg{fill:#f3f6f8}.panel{fill:#fff;stroke:#d7dfe8;stroke-width:2}.ink{fill:#142033}.muted{fill:#52647a}.red{fill:#a30d23}.gold{fill:#d39b31}.teal{fill:#16736b}.blue{fill:#315f86}
      .kicker{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:0}.title{font:760 39px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:0}.label{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:0}.small{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:0}.num{font:760 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
    </style><rect class="bg" width="1200" height="720"/><rect class="panel" x="36" y="36" width="1128" height="648" rx="8"/><rect class="red" x="72" y="72" width="112" height="7"/><text x="72" y="116" text-anchor="start" class="kicker red">次序</text><text x="72" y="168" text-anchor="start" class="title ink">遗产房仍有按揭或欠款，继承和还款应怎样排顺序</text><line x1="140" y1="420" x2="1060" y2="420" stroke="#ced8e2" stroke-width="6"/><circle class="red" cx="140" cy="420" r="34"/><text class="num" x="140" y="428" text-anchor="middle" fill="#fff">1</text><text x="140" y="500" text-anchor="middle" class="small ink">先查清欠的是什么</text><circle class="gold" cx="446" cy="420" r="34"/><text class="num" x="446" y="428" text-anchor="middle" fill="#fff">2</text><text x="446" y="500" text-anchor="middle" class="small ink">还款决定要和房屋方</text><text x="446" y="529" text-anchor="middle" class="small ink">案一起看</text><circle class="teal" cx="752" cy="420" r="34"/><text class="num" x="752" y="428" text-anchor="middle" fill="#fff">3</text><text x="752" y="500" text-anchor="middle" class="small ink">不要忽略保险和其他</text><text x="752" y="529" text-anchor="middle" class="small ink">合同安排</text><circle class="blue" cx="1058" cy="420" r="34"/><text class="num" x="1058" y="428" text-anchor="middle" fill="#fff">4</text><text x="1058" y="500" text-anchor="middle" class="small ink">有出售计划时先算净</text><text x="1058" y="529" text-anchor="middle" class="small ink">值</text></svg>
