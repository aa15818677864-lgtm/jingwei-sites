<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Identify the representative, then match the asset</title><desc id="desc">The two processes connect, but they do not merge into one.</desc><style>text{font-family:Arial,"Microsoft JhengHei","PingFang TC",sans-serif;fill:#0e2235}.title{font-size:46px;font-weight:700}.item{font-size:34px;font-weight:700}.compact{font-size:30px}.small{font-size:29px}.caption{font-size:26px;fill:#5d6b77}.plus,.num{font-size:24px;font-weight:700;fill:white}</style><rect width="1200" height="720" fill="#f6f2e8"/><rect x="55" y="55" width="1090" height="610" rx="22" fill="#fbfaf6" stroke="#d6c8a6" stroke-width="2"/><text x="90" y="145" class="title">Identify the representative, then match the asset</text><rect x="90" y="180" width="92" height="5" fill="#a71930"/><rect x="95" y="260" width="270" height="170" rx="14" fill="#fffdf8" stroke="#c8a25e" stroke-width="3"/><text x="230" y="333" text-anchor="middle" class="item compact"><tspan x="230" dy="0">Establish</tspan><tspan x="230" dy="34">domicile facts</tspan></text><path d="M373 345 H415" stroke="#a71930" stroke-width="4"/><rect x="420" y="260" width="270" height="170" rx="14" fill="#fffdf8" stroke="#c8a25e" stroke-width="3"/><text x="555" y="333" text-anchor="middle" class="item compact"><tspan x="555" dy="0">Organise will or</tspan><tspan x="555" dy="34">grant papers</tspan></text><path d="M698 345 H740" stroke="#a71930" stroke-width="4"/><rect x="745" y="260" width="270" height="170" rx="14" fill="#fffdf8" stroke="#c8a25e" stroke-width="3"/><text x="880" y="333" text-anchor="middle" class="item compact"><tspan x="880" dy="0">Check each</tspan><tspan x="880" dy="34">Mainland asset</tspan></text><text x="90" y="620" class="caption">The two processes connect, but they do not merge into one.</text></svg>