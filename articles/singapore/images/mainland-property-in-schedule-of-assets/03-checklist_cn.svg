<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">核对内地房产四项</title><desc id="desc">资产清单是遗产申报文件，不是内地房产证明。</desc><style>text{font-family:Arial,"Microsoft JhengHei","PingFang TC",sans-serif;fill:#0e2235}.title{font-size:46px;font-weight:700}.item{font-size:34px;font-weight:700}.compact{font-size:30px}.small{font-size:29px}.caption{font-size:26px;fill:#5d6b77}.plus,.num{font-size:24px;font-weight:700;fill:white}</style><rect width="1200" height="720" fill="#f6f2e8"/><rect x="55" y="55" width="1090" height="610" rx="22" fill="#fbfaf6" stroke="#d6c8a6" stroke-width="2"/><text x="90" y="145" class="title">核对内地房产四项</text><rect x="90" y="180" width="92" height="5" fill="#a71930"/><rect x="90" y="245" width="490" height="125" rx="12" fill="#fffdf8" stroke="#d7c49c" stroke-width="2"/><circle cx="132" cy="307" r="21" fill="#a71930"/><text x="132" y="315" text-anchor="middle" class="num">1</text><text x="375" y="315" text-anchor="middle" class="item small"><tspan x="375" dy="0">逝者住所</tspan></text><rect x="620" y="245" width="490" height="125" rx="12" fill="#fffdf8" stroke="#d7c49c" stroke-width="2"/><circle cx="662" cy="307" r="21" fill="#a71930"/><text x="662" y="315" text-anchor="middle" class="num">2</text><text x="905" y="315" text-anchor="middle" class="item small"><tspan x="905" dy="0">城市地址</tspan></text><rect x="90" y="410" width="490" height="125" rx="12" fill="#fffdf8" stroke="#d7c49c" stroke-width="2"/><circle cx="132" cy="472" r="21" fill="#a71930"/><text x="132" y="480" text-anchor="middle" class="num">3</text><text x="375" y="480" text-anchor="middle" class="item small"><tspan x="375" dy="0">登记姓名及份额</tspan></text><rect x="620" y="410" width="490" height="125" rx="12" fill="#fffdf8" stroke="#d7c49c" stroke-width="2"/><circle cx="662" cy="472" r="21" fill="#a71930"/><text x="662" y="480" text-anchor="middle" class="num">4</text><text x="905" y="480" text-anchor="middle" class="item small"><tspan x="905" dy="0">清单和 grant 状态</tspan></text><text x="90" y="620" class="caption">资产清单是遗产申报文件，不是内地房产证明。</text></svg>