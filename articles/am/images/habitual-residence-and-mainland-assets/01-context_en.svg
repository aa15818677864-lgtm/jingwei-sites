<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Two locations answer two questions</title><desc id="desc">The place of death cannot replace either factual enquiry.</desc><style>text{font-family:Arial,"Microsoft JhengHei","PingFang TC",sans-serif;fill:#0e2235}.title{font-size:46px;font-weight:700}.item{font-size:34px;font-weight:700}.compact{font-size:30px}.small{font-size:29px}.caption{font-size:26px;fill:#5d6b77}.plus,.num{font-size:24px;font-weight:700;fill:white}</style><rect width="1200" height="720" fill="#f6f2e8"/><rect x="55" y="55" width="1090" height="610" rx="22" fill="#fbfaf6" stroke="#d6c8a6" stroke-width="2"/><text x="90" y="145" class="title">Two locations answer two questions</text><rect x="90" y="180" width="92" height="5" fill="#a71930"/><rect x="110" y="250" width="390" height="220" rx="16" fill="#fffdf8" stroke="#c8a25e" stroke-width="3"/><text x="305" y="338" text-anchor="middle" class="item compact"><tspan x="305" dy="0">Habitual residence:</tspan><tspan x="305" dy="34">settled life centre</tspan></text><rect x="700" y="250" width="390" height="220" rx="16" fill="#fffdf8" stroke="#c8a25e" stroke-width="3"/><text x="895" y="338" text-anchor="middle" class="item compact"><tspan x="895" dy="0">Asset location:</tspan><tspan x="895" dy="34">property or account city</tspan></text><path d="M510 360 H690" stroke="#a71930" stroke-width="5"/><circle cx="600" cy="360" r="22" fill="#a71930"/><text x="600" y="368" text-anchor="middle" class="plus">+</text><text x="90" y="620" class="caption">The place of death cannot replace either factual enquiry.</text></svg>